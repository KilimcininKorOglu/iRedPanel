name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ldap, pdo, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        # The version field is intentional: APP_VERSION is read from it.
        run: composer validate --no-check-publish --no-check-version --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check
        run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l

      - name: Run PHPUnit
        run: vendor/bin/phpunit --do-not-cache-result --no-coverage
