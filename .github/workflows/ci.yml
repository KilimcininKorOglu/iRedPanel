name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ldap, pdo, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        # The version field is intentional: APP_VERSION is read from it.
        run: composer validate --no-check-publish --no-check-version --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check
        run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l

      - name: Run PHPUnit
        run: vendor/bin/phpunit --do-not-cache-result --no-coverage
